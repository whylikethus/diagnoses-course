  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="course-data.js"></script>
  <style>
    :root {
      --bg:#0a0e1a;--surface:#111827;--card:#1a2235;
      --border:rgba(99,179,237,0.15);--accent:#63b3ed;--accent2:#9f7aea;
      --gold:#f6d860;--text:#e2e8f0;--muted:#718096;--sidebar-w:330px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);
         height:100vh;display:flex;flex-direction:column;overflow:hidden;}

    /* HEADER */
    header{background:linear-gradient(135deg,#0d1b3e 0%,#1a0a3e 100%);
           border-bottom:1px solid var(--border);padding:0 24px;height:64px;
           display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:10;
           box-shadow:0 4px 24px rgba(0,0,0,0.4);}
    .logo{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));
          border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
    header h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));
              -webkit-background-clip:text;-webkit-text-fill-color:transparent;flex:1;}
    .search-wrap{position:relative;width:210px;}
    .search-wrap input{width:100%;background:rgba(255,255,255,0.07);border:1px solid var(--border);
      border-radius:24px;padding:7px 16px 7px 36px;color:var(--text);font-family:'Heebo',sans-serif;
      font-size:13px;outline:none;transition:border-color .2s;}
    .search-wrap input:focus{border-color:var(--accent);}
    .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
    .badge{background:rgba(99,179,237,0.12);border:1px solid rgba(99,179,237,0.25);
           border-radius:20px;padding:4px 12px;font-size:12px;color:var(--accent);white-space:nowrap;}

    /* LAYOUT */
    .main{display:flex;flex:1;overflow:hidden;}

    /* SIDEBAR */
    aside{width:var(--sidebar-w);background:var(--surface);border-left:1px solid var(--border);
          display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
    .sidebar-inner{overflow-y:auto;flex:1;padding:8px 0 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .chapter{margin-bottom:2px;}
    .ch-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;
            user-select:none;transition:background .15s;}
    .ch-hdr:hover{background:rgba(99,179,237,0.06);}
    .ch-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
             font-size:14px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));}
    .ch-name{font-size:12.5px;font-weight:600;color:var(--text);flex:1;line-height:1.3;}
    .ch-count{font-size:11px;color:var(--muted);background:rgba(255,255,255,0.05);border-radius:10px;padding:2px 7px;}
    .chevron{color:var(--muted);transition:transform .25s;flex-shrink:0;}
    .chapter.open .chevron{transform:rotate(90deg);}
    .lesson-list{overflow:hidden;max-height:0;transition:max-height .3s ease;}
    .chapter.open .lesson-list{max-height:3000px;}
    .lesson-item{display:flex;align-items:center;gap:10px;padding:7px 16px 7px 28px;cursor:pointer;
                 transition:background .15s;position:relative;}
    .lesson-item:hover{background:rgba(99,179,237,0.08);}
    .lesson-item.active{background:rgba(99,179,237,0.14);}
    .lesson-item.active::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:linear-gradient(to bottom,var(--accent),var(--accent2));border-radius:0 3px 3px 0;}
    .pdf-badge{width:26px;height:26px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);
               border-radius:6px;display:flex;align-items:center;justify-content:center;
               font-size:9px;color:#fc8181;flex-shrink:0;font-weight:800;letter-spacing:-.5px;}
    .l-name{font-size:12px;color:#cbd5e0;line-height:1.3;flex:1;}
    .lesson-item.active .l-name{color:var(--accent);}
    .l-size{font-size:10px;color:var(--muted);white-space:nowrap;}

    /* VIEWER */
    .viewer{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0d1117;}
    .viewer-bar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;
                display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .viewer-title{font-size:13px;font-weight:600;color:var(--text);flex:1;}
    .btn{display:flex;align-items:center;gap:6px;background:rgba(99,179,237,0.1);
         border:1px solid rgba(99,179,237,0.25);border-radius:8px;padding:6px 14px;
         color:var(--accent);font-family:'Heebo',sans-serif;font-size:12px;cursor:pointer;
         transition:all .2s;text-decoration:none;}
    .btn:hover{background:rgba(99,179,237,0.2);border-color:var(--accent);}
    #pdf-frame{flex:1;border:none;width:100%;}

    /* WELCOME */
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
             gap:20px;padding:40px;text-align:center;}
    .w-icon{width:90px;height:90px;background:linear-gradient(135deg,rgba(99,179,237,0.15),rgba(159,122,234,0.15));
            border:1px solid rgba(99,179,237,0.25);border-radius:24px;display:flex;align-items:center;
            justify-content:center;font-size:44px;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
    .welcome h2{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));
                -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .welcome p{color:var(--muted);font-size:14px;max-width:380px;line-height:1.7;}
    .stats-row{display:flex;gap:16px;margin-top:8px;}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 22px;text-align:center;}
    .stat .n{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--gold));
             -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
    .no-r{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  </style>
</head>

<div class="main">

  <div class="viewer" id="viewer">
    <div class="welcome" id="welcome">
      <div class="w-icon">ðŸ“š</div>
      <h2>×‘×¨×•×›×™× ×”×‘××™× ×œ×§×•×¨×¡</h2>
      <p>×‘×—×¨×• ×©×™×¢×•×¨ ×ž×”×¨×©×™×ž×” ×›×“×™ ×œ×¦×¤×•×ª ×‘×• ×™×©×™×¨×•×ª ×‘×“×¤×“×¤×Ÿ</p>
      <div class="stats-row">
        <div class="stat"><div class="n" id="s-ch">â€“</div><div class="l">×¤×¨×§×™×</div></div>
        <div class="stat"><div class="n" id="s-ls">â€“</div><div class="l">×©×™×¢×•×¨×™×</div></div>

    </div>

<script>
const data = window.COURSE_DATA || [];
let totalL = 0;
data.forEach(c => totalL += c.lessons.length);
document.getElementById('s-ch').textContent = data.length;
document.getElementById('s-ls').textContent = totalL;
document.getElementById('badge').textContent = totalL + ' ×©×™×¢×•×¨×™×';

const icons = ['ðŸ«','ðŸ“‹','ðŸ§ ','âš•ï¸','ðŸŒ¿','ðŸ’Š','ðŸ”¬','ðŸ“–','ðŸ¥','ðŸŒ™','ðŸ§¬','â¤ï¸'];

function buildSidebar(q) {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  let any = false;
  data.forEach((ch, ci) => {
    const ls = q ? ch.lessons.filter(l => l.name.includes(q)) : ch.lessons;
    if (!ls.length) return;
    any = true;
    const d = document.createElement('div');
    d.className = 'chapter' + (ci===0||q?' open':'');
    d.innerHTML =
      '<div class="ch-hdr" onclick="this.parentElement.classList.toggle(\'open\')">' +
        '<div class="ch-icon">'+icons[ci%icons.length]+'</div>' +
        '<div class="ch-name">'+ch.name+'</div>' +
        '<div class="ch-count">'+ls.length+'</div>' +
        '<svg class="chevron" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>' +
      '</div>' +
      '<div class="lesson-list">' +
        ls.map(l =>
          '<div class="lesson-item" onclick="openPDF(this,\''+l.file+'\',\''+l.name.replace(/'/g,'')+'\')" data-file="'+l.file+'">' +
            '<div class="pdf-badge">PDF</div>' +
            '<div class="l-name">'+l.name+'</div>' +
            '<div class="l-size">'+l.sizeMB+'MB</div>' +
          '</div>'
        ).join('') +
      '</div>';
    sb.appendChild(d);
  });
  if (!any) sb.innerHTML = '<div class="no-r">×œ× × ×ž×¦××• ×ª×•×¦××•×ª ðŸ”</div>';
}

let active = null;
function openPDF(el, file, name) {
  if (active) active.classList.remove('active');
  el.classList.add('active');
  active = el;
  document.getElementById('welcome').style.display = 'none';
  const w = document.getElementById('pdf-wrap');
  w.style.display = 'flex';
  document.getElementById('pdf-title').textContent = name;
  // Use PDF.js hosted viewer
  const base = window.location.href.replace(/\/[^\/]*$/, '/');
  document.getElementById('pdf-frame').src =
    'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(base + file);
}

function goFullscreen() {
  const f = document.getElementById('pdf-frame');
  (f.requestFullscreen || f.webkitRequestFullscreen || f.mozRequestFullScreen).call(f);
}

document.getElementById('search').addEventListener('input', e => buildSidebar(e.target.value.trim()));
buildSidebar('');
</script>
